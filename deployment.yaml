apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrag-openarchiver-connector
  labels:
    app.kubernetes.io/name: openrag-openarchiver-connector
    app.kubernetes.io/part-of: openrag
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openrag-openarchiver-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrag-openarchiver-connector
        app.kubernetes.io/part-of: openrag
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          # KISS : réutilise l'image Python OpenRAG déjà présente dans le cluster.
          image: ghcr.io/fermedepommerieux/openrag-compose/openrag-backend:350cf4b395e3d92be1f8a405d94a73552b9e1aa2
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/openrag-openarchiver-connector/connector.py
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: STATE_DB
              value: /state/connector.sqlite3
            - name: OPENARCHIVER_BASE_URL
              value: http://openarchiver-api.openarchiver.svc.cluster.local:4000/v1
            - name: OPENARCHIVER_API_KEY_FILE
              value: /var/run/secrets/connector/openarchiver-api-key
            - name: OPENARCHIVER_SOURCE_URL_TEMPLATE
              value: ""
            - name: OPENRAG_BASE_URL
              value: http://openrag-backend.openrag.svc.cluster.local:8000
            - name: OPENRAG_INGEST_PATH
              value: /v1/documents/ingest-path
            - name: OPENRAG_INGEST_MODE
              value: auto
            - name: OPENRAG_UPLOAD_PATH
              value: /v1/documents/ingest
            - name: OPENRAG_INGEST_DIRECTORY
              value: /shared/openrag-documents/openarchiver
            - name: OPENRAG_TASK_PATH
              value: /v1/tasks/{task_id}/enhanced
            - name: OPENRAG_API_KEY_FILE
              value: /var/run/secrets/connector/openrag-api-key
            - name: SCAN_INTERVAL_SECONDS
              value: "3600"
            - name: CYCLE_RETRY_SECONDS
              value: "60"
            - name: TASK_TIMEOUT_SECONDS
              value: "3600"
            - name: MAX_FILE_BYTES
              value: "104857600"
            - name: MAX_AUTO_RETRIES
              value: "3"
            - name: RETRY_BASE_SECONDS
              value: "300"
            - name: RETRY_MAX_SECONDS
              value: "3600"
            - name: OPENARCHIVER_REQUESTS_PER_MINUTE
              value: "90"
            - name: OPENARCHIVER_PAGE_LIMIT
              value: "250"
            - name: INGESTION_CONCURRENCY
              value: "2"
            - name: INGESTION_CONCURRENCY_MAX
              value: "4"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "30"
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: code
              mountPath: /opt/openrag-openarchiver-connector
              readOnly: true
            - name: state
              mountPath: /state
            - name: api-keys
              mountPath: /var/run/secrets/connector
              readOnly: true
            - name: shared
              mountPath: /shared
      volumes:
        - name: code
          configMap:
            name: openrag-openarchiver-connector
            defaultMode: 0444
        - name: state
          persistentVolumeClaim:
            claimName: openrag-openarchiver-connector-state
        - name: api-keys
          secret:
            secretName: openrag-openarchiver-connector-api
            defaultMode: 0400
            items:
              - key: openarchiver-api-key
                path: openarchiver-api-key
              - key: openrag-api-key
                path: openrag-api-key
        - name: shared
          persistentVolumeClaim:
            claimName: openrag-shared
